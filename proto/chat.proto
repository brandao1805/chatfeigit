syntax = "proto3";
package chatfei;
option java_package = "br.fei.chat.proto";
option java_outer_classname = "Protocol";
// Timestamps Unix em milissegundos UTC. request_id identifica uma operação.
message Envelope {
 string request_id = 1;
 int64 timestamp_ms = 2;
 string operation = 3;
 string username = 4;
 string channel = 5;
 string status = 6;
 string detail = 7;
 repeated string channels = 8;
 string server_id = 9;
 string body = 10;
 int64 logical_clock = 11;
 int32 rank = 12;
 repeated ServerInfo servers = 13;
}


message ServerInfo { string name = 1; int32 rank = 2; }
