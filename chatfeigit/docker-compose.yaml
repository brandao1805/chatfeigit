name: chatfei
services:
  # Serviço de referência: atribui ranks e mantém o conjunto de servidores ativos.
  reference:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [reference]
    init: true
    environment:
      NODE_ID: reference
      REFERENCE_TTL_SECONDS: "60"
  # Broker REQ/REP compartilhado por todos os bots e servidores.
  broker:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [broker]
    init: true
  # Proxy Pub/Sub: os servidores publicam no XSUB e os bots assinam via XPUB.
  pubsub:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [pubsub]
    init: true
  # Dois servidores Python; cada um persiste em seu próprio volume SQLite.
  python-server-1:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [server]
    init: true
    depends_on: [broker, pubsub, reference]
    environment:
      NODE_ID: python-server-1
    volumes:
      - python-server-1-data:/data
  python-server-2:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [server]
    init: true
    depends_on: [broker, pubsub, reference]
    environment:
      NODE_ID: python-server-2
    volumes:
      - python-server-2-data:/data
  # Os bots Python executam login, seleção de canal, inscrição e publicação automáticos.
  python-bot-1:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [bot]
    init: true
    depends_on: [broker, pubsub]
    environment:
      NODE_ID: python-bot-1
  python-bot-2:
    build:
      context: .
      dockerfile: python/Dockerfile
    command: [bot]
    init: true
    depends_on: [broker, pubsub]
    environment:
      NODE_ID: python-bot-2
  # As mesmas funções também são implementadas em Java para interoperar com Python.
  java-server-1:
    build:
      context: .
      dockerfile: java/Dockerfile
    command: [server]
    init: true
    depends_on: [broker, pubsub, reference]
    environment:
      NODE_ID: java-server-1
    volumes:
      - java-server-1-data:/data
  java-server-2:
    build:
      context: .
      dockerfile: java/Dockerfile
    command: [server]
    init: true
    depends_on: [broker, pubsub, reference]
    environment:
      NODE_ID: java-server-2
    volumes:
      - java-server-2-data:/data
  java-bot-1:
    build:
      context: .
      dockerfile: java/Dockerfile
    command: [bot]
    init: true
    depends_on: [broker, pubsub]
    environment:
      NODE_ID: java-bot-1
  java-bot-2:
    build:
      context: .
      dockerfile: java/Dockerfile
    command: [bot]
    init: true
    depends_on: [broker, pubsub]
    environment:
      NODE_ID: java-bot-2
volumes:
  # Volumes separados preservam os bancos locais mesmo depois de docker compose down.
  python-server-1-data:
  python-server-2-data:
  java-server-1-data:
  java-server-2-data:

